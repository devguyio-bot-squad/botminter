# botminter — managed tmux configuration
# This file is unconditionally overwritten on startup.
# Do not edit manually.

# Terminal
set-option -g default-terminal "screen-256color"

# Window behavior
set-option -g automatic-rename off
set-option -g allow-rename off
set-option -g remain-on-exit on

# Scrollback
set-option -g history-limit 50000

# Mouse
set-option -g mouse on

# Security: prevent operator env vars from leaking into agent sessions
set-option -g update-environment ""

# Status bar — botminter branding
set-option -g status-style "bg=colour235,fg=colour248"
set-option -g status-left " botminter | #S | "
set-option -g status-left-length 40
set-option -g status-right " C-b n:next  C-b p:prev  C-b [:scroll | %H:%M "
set-option -g status-right-length 60

# Window tabs
set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format " #I:#W "
set-option -g window-status-current-style "bg=colour240,fg=colour255,bold"
